{% macro icon(name, size=18) %}<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% for d in ICONS[name] %}<path d="{{ d }}"/>{% endfor %}</svg>{% endmacro %}
{% macro cat_icon(category, size=16) %}{% set st = category_style(category) %}<span class="cico" style="--c:{{ st.color }}">{{ icon(st.icon, size) }}</span>{% endmacro %}
